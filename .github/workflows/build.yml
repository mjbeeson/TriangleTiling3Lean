name: Build

# Pushes to main and pull requests (not both for the same commit of a PR branch).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Until lake-manifest.json is committed, generate it here and save it as a run artifact.
      - name: Generate lake-manifest.json if missing
        if: hashFiles('lake-manifest.json') == ''
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" update
      - name: Save generated manifest
        if: hashFiles('lake-manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lake-manifest
          path: lake-manifest.json
      # Bonfioli's Erdos634 package (source and compiled files), saved once per pinned version.
      # Mathlib is not cached here: `lake exe cache get` downloads it ready-built. Caching all of
      # `.lake` (about 10 GB) overflowed the cache and the runner's disk.
      - name: Cache Erdos634
        uses: actions/cache@v4
        with:
          path: .lake/packages/Erdos634
          key: erdos634-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
      # Installs Lean from lean-toolchain, fetches the Mathlib cache, runs `lake build`.
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
      - name: Reject sorry in our own files
        run: |
          if grep -rnw --include='*.lean' 'sorry' TriangleTiling TriangleTiling.lean; then
            echo "Found sorry"; exit 1
          fi
